<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <style>
        :root { --bg: #f4f4f9; --text: #333; --accent: #2563eb; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); padding: 2rem; }
        .card { background: #fff; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 600px; margin: 0 auto; }
        h1 { margin-top: 0; font-size: 1.5rem; color: var(--accent); }
        .user-info { font-size: 1.1rem; margin: 1.5rem 0; }
        .logout { display: inline-block; padding: 0.6rem 1.2rem; background: #eee; color: #333; border: none; border-radius: 4px; text-decoration: none; font-size: 0.875rem; font-weight: 500; }
        .logout:hover { background: #e5e5e5; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Dashboard</h1>
        <div class="user-info">Logged in as: <strong>{{.}}</strong></div>
        <p>This is a protected page. Your session is active.</p>
        <a href="/logout" class="logout">Logout</a>
    </div>
</body>
</html>
