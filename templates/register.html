<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <style>
        :root { --bg: #f4f4f9; --text: #333; --accent: #2563eb; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); display: grid; place-items: center; min-height: 100vh; margin: 0; }
        .card { background: #fff; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 320px; }
        h1 { margin-top: 0; font-size: 1.5rem; text-align: center; }
        input { width: 100%; padding: 0.75rem; margin: 0.5rem 0 1rem; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 0.75rem; background: var(--accent); color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; }
        button:hover { opacity: 0.9; }
        .error { color: #dc2626; font-size: 0.875rem; margin-bottom: 1rem; text-align: center; }
        a { display: block; text-align: center; margin-top: 1rem; color: var(--accent); text-decoration: none; font-size: 0.875rem; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Create Account</h1>
        {{if .}}<div class="error">{{.}}</div>{{end}}
        <form action="/register" method="POST">
            <label for="username">Username</label>
            <input type="text" name="username" id="username" required autocomplete="username">
            <label for="password">Password</label>
            <input type="password" name="password" id="password" required autocomplete="new-password">
            <button type="submit">Register</button>
        </form>
        <a href="/login">Already have an account? Login</a>
    </div>
</body>
</html>
