name: Build and Release

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Verify dependencies
        run: go mod download

      - name: Run Tests
        run: make test

      - name: Build Application
        run: make build

      - name: Test Run (Verify it's runnable)
        run: |
          ./auth-server &
          PID=$!
          # Wait for server to start
          max_retries=5
          count=0
          until curl -s http://localhost:8080/health | grep -q "up"; do
            count=$((count + 1))
            if [ $count -eq $max_retries ]; then
              echo "Application failed to start or health check failed"
              kill $PID || true
              exit 1
            fi
            echo "Waiting for server... ($count/$max_retries)"
            sleep 2
          done
          echo "Application is running and healthy"
          kill $PID || true

      - name: Check for Release Tag
        id: release_check
        run: |
          if [[ "${{ github.event.head_commit.message }}" == *"<release:true>"* ]]; then
            echo "should_release=true" >> $GITHUB_OUTPUT
          else
            echo "should_release=false" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        if: steps.release_check.outputs.should_release == 'true' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          body: |
            Automated release generated by GitHub Actions.
            
            Commit message:
            ${{ github.event.head_commit.message }}
          files: |
            auth-server
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
